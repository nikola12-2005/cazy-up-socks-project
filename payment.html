<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Cozy Up Socks</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-pink">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Cozy Up Socks</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="details.html">Details</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="payment.html">Payment</a></li>
                </ul>
            </div>
        </div>
    </nav>

<!-- Payment Section -->
<main>
    <section id="payment" class="payment-form py-5">
        <div class="container">
            <div class="payment-box">
                <h3>Payment Information</h3>
                <form>
                    <label for="card-name">Cardholder Name:</label>
                    <input type="text" id="card-name" name="card-name" class="form-control" required>

                    <label for="card-number">Card Number:</label>
                    <input type="text" id="card-number" name="card-number" class="form-control" required>

                    <label for="expiry-date">Expiry Date:</label>
                    <input type="month" id="expiry-date" name="expiry-date" class="form-control" required>

                    <label for="cvv">CVV:</label>
                    <input type="text" id="cvv" name="cvv" class="form-control" required>

                    <button type="submit" class="btn btn-primary">Submit Payment</button>
                </form>
            </div>
        </div>
    </section>
</main>

<footer class="bg-pink text-center py-3">
    <p>&copy; 2024 Cozy Up Socks</p>
</footer>
</body>
</html>
