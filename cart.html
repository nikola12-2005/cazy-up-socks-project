<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Cozy Up Socks</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-pink">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Cozy Up Socks</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="details.html">Details</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
                    <li class="nav-item"><a class="nav-link" href="payment.html">Payment</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Shopping Cart Section -->
    <main>
        <section id="cart" class="cart py-5">
            <div class="container">
                <div class="cart-box">
                    <h3>Your Shopping Cart</h3>
                    <div id="cart-items">
                        <!-- Cart items will be injected by JS -->
                    </div>
                    <div class="total">
                        <p>Total: <span id="total-price">€0.00</span></p>
                    </div>
                    <a href="payment.html" class="btn">Proceed to Payment</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-pink text-center py-3">
        <p>&copy; 2024 Cozy Up Socks</p>
    </footer>

    <script>
        const cartItems = [
            { name: 'Colorful Stripes', price: 5.00, quantity: 1 },
            { name: 'Funky Dots', price: 6.00, quantity: 1 }
        ];

        function updateCart() {
            const cartContainer = document.getElementById('cart-items');
            const totalPriceElement = document.getElementById('total-price');
            cartContainer.innerHTML = ''; // Clear current items
            let total = 0;

            cartItems.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const cartItemDiv = document.createElement('div');
                cartItemDiv.classList.add('cart-item');
                cartItemDiv.innerHTML = `
                    <div>${item.name} - €${item.price.toFixed(2)}</div>
                    <div>
                        Quantity: <button class="change-quantity" data-index="${index}" data-action="decrease">-</button>
                        <span>${item.quantity}</span>
                        <button class="change-quantity" data-index="${index}" data-action="increase">+</button>
                    </div>
                    <div><button class="remove-item" data-index="${index}">Remove</button></div>
                `;
                cartContainer.appendChild(cartItemDiv);
            });

            totalPriceElement.textContent = `€${total.toFixed(2)}`;
        }

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('change-quantity')) {
                const index = e.target.getAttribute('data-index');
                const action = e.target.getAttribute('data-action');

                if (action === 'increase') {
                    cartItems[index].quantity++;
                } else if (action === 'decrease' && cartItems[index].quantity > 1) {
                    cartItems[index].quantity--;
                }

                updateCart();
            }

            if (e.target.classList.contains('remove-item')) {
                const index = e.target.getAttribute('data-index');
                cartItems.splice(index, 1);
                updateCart();
            }
        });

        updateCart(); // Initialize cart items
    </script>
</body>
</html>
